# idd.yml — 他のプロジェクトに置く呼び出し（これだけ）。
#   前提: Variables IDD_APPROVERS（必須）/ IDD_MEMBERS（任意）、Secret CLAUDE_CODE_OAUTH_TOKEN、
#         ラベル（node scripts/setup.mjs）、docs/ops/ISSUE-FLOW.md、CONTRIBUTING.md
#   確認用ページの出し方はプロジェクトごとに違うので、preview / preview-url の2ジョブだけ書き換える。
name: idd
on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [closed]

jobs:
  issue:
    if: github.event_name != 'pull_request'
    uses: kenhomma/idd/.github/workflows/issue.yml@main   # 安定したら @v1 に固定する
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    with:
      approvers: ${{ vars.IDD_APPROVERS }}
      # extra_allowed_tools: '"Bash(npm:*)"'   # ビルドが要るプロジェクトで
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # ── ここから下はプロジェクト固有。確認用ページをどう出すかで書き換える ──
  # 例1: Vercel（ブランチ push で Preview が自動）→ deploy は不要。URL の追記だけ
  preview-url:
    needs: issue
    if: always() && needs.issue.outputs.branch != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write     # 画面写真を idd-previews ブランチに置くため
      issues: write
    steps:
      - uses: actions/checkout@v4
        with: { repository: kenhomma/idd, ref: main, path: .idd, fetch-depth: 1 }
      - env:
          GH_TOKEN: ${{ github.token }}
          IDD_REPO: ${{ github.repository }}
          IDD_APPROVERS: ${{ vars.IDD_APPROVERS }}
        run: node .idd/scripts/reply.mjs append-url --issue "${{ needs.issue.outputs.issue }}" --url "https://<project>-git-${{ needs.issue.outputs.branch }}-<team>.vercel.app"
      # 画面写真（スマホ 375 / PC 1440）を同じコメントに貼る。プレビューは常に付ける
      - env:
          GH_TOKEN: ${{ github.token }}
          IDD_REPO: ${{ github.repository }}
          IDD_APPROVERS: ${{ vars.IDD_APPROVERS }}
        run: node .idd/scripts/shots.mjs --issue "${{ needs.issue.outputs.issue }}" --url "https://<project>-git-${{ needs.issue.outputs.branch }}-<team>.vercel.app"
  # 例2: 独自の配信（Shopify テーマなど）→ 自前の workflow_call を needs: issue で呼び、その後に append-url

  pr-open:
    if: github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == '反映OK'
    uses: kenhomma/idd/.github/workflows/pr-open.yml@main
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      members: ${{ vars.IDD_MEMBERS }}
      approvers: ${{ vars.IDD_APPROVERS }}

  released:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    uses: kenhomma/idd/.github/workflows/after-merge.yml@main
    permissions:
      contents: read
      issues: write
      pull-requests: read
    with:
      production_url: https://<本番のURL>/
      approvers: ${{ vars.IDD_APPROVERS }}
